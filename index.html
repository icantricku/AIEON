<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>AIEON</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f9eef5;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #2a0d24;
        }
      }
      :root[data-theme="dark"] {
        --bg: #2a0d24;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
        height: 100%;
      }
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family:
          Inter, "Noto Sans", "Hiragino Sans", "Yu Gothic", "Malgun Gothic",
          "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      button,
      input,
      select {
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid #b2198b;
        outline-offset: 2px;
      }
      #st {
        width: 960px;
        height: 540px;
        flex: none;
        position: relative;
        overflow: hidden;
        background: #f9eef5;
        color: #3a1030;
        border-radius: 18px;
        color-scheme: light;
      }
      #sc {
        position: absolute;
        inset: 0;
        display: flex;
      }
      input {
        cursor: text;
      }
      .fi {
        width: 100%;
        height: 48px;
        border: 1px solid #e6b9d5;
        border-radius: 14px;
        background: #fff;
        color: #3a1030;
        -webkit-text-fill-color: #3a1030;
        caret-color: #b2198b;
        padding: 0 14px;
        font-size: 16px;
      }
      .fi::placeholder {
        color: #6b4a62;
        -webkit-text-fill-color: #6b4a62;
        opacity: 1;
      }
      .fi:focus {
        border: 2px solid #b2198b;
      }
      #lg {
        position: absolute;
        right: 90px;
        bottom: 20px;
        height: 44px;
        border-radius: 22px;
        border: 1px solid #e6b9d5;
        background: #fff;
        color: #3a1030;
        padding: 0 12px;
        font-size: 13px;
        font-weight: 600;
        z-index: 5;
      }
      .b {
        background: #b2198b;
        color: #fff;
        border: 0;
        border-radius: 14px;
        min-height: 48px;
        padding: 0 20px;
        font-weight: 600;
        font-size: 15px;
      }
      .g {
        background: #fff;
        color: #8a1269;
        border: 1px solid #e6b9d5;
        border-radius: 14px;
        min-height: 48px;
        padding: 0 20px;
        font-weight: 600;
        font-size: 15px;
      }
      .sb {
        min-height: 44px;
        padding: 0 14px;
        font-size: 13px;
      }
      .i {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 0;
        background: #fff;
        color: #8a1269;
        font-size: 22px;
        display: grid;
        place-items: center;
        box-shadow: 0 2px 8px #3a103022;
        flex: none;
      }
      .o {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: #f9eef5;
        display: grid;
        place-items: center;
        flex: none;
      }
      .t {
        background: #fff;
        border: 1px solid #e6b9d5;
        border-radius: 18px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: flex-start;
        text-align: left;
        color: #3a1030;
        font-size: 16px;
        font-weight: 600;
        height: 108px;
      }
      .sm {
        font-weight: 400;
        font-size: 13px;
        color: #6b4a62;
      }
      .c {
        background: #f9eef5;
        border-radius: 16px;
        padding: 14px;
      }
      .n {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #b2198b;
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 13px;
        font-weight: 700;
        flex: none;
      }
      .rw {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .cd {
        background: #fff;
        border: 1px solid #e6b9d5;
        border-radius: 16px;
        padding: 10px 14px;
      }
      .v {
        width: 96px;
        min-height: 56px;
        border: 0;
        border-radius: 14px;
        background: #fff;
        color: #3a1030;
        font-weight: 600;
        font-size: 12px;
        box-shadow: 0 2px 8px #3a103022;
      }
      .v.a {
        background: #b2198b;
        color: #fff;
      }
      .fab {
        position: absolute;
        right: 16px;
        bottom: 16px;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 3px solid #b2198b;
        background: #fff;
        display: grid;
        place-items: center;
        box-shadow: 0 4px 14px #3a103040;
        z-index: 5;
        padding: 0;
      }
      .pn {
        position: absolute;
        right: 16px;
        bottom: 90px;
        width: 340px;
        height: 390px;
        background: #fff;
        border: 1px solid #e6b9d5;
        border-radius: 20px;
        box-shadow: 0 8px 28px #3a103040;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        z-index: 5;
      }
      .pn[hidden] {
        display: none;
      }
      .pn:not([hidden]) {
        animation: pop 0.22s ease-out;
        transform-origin: 100% 100%;
      }
      .bm {
        animation: up 0.2s ease-out;
      }
      .b,
      .g,
      .i,
      .v,
      .t,
      .fab,
      .ch button {
        transition:
          transform 0.12s ease,
          box-shadow 0.15s ease,
          background-color 0.15s ease;
      }
      .b:active,
      .g:active,
      .i:active,
      .v:active,
      .t:active,
      .fab:active {
        transform: scale(0.96);
      }
      .t:hover {
        box-shadow: 0 4px 12px #3a103022;
      }
      .dr {
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: dr 1.1s 0.3s ease-out forwards;
      }
      @keyframes dr {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.94);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes up {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          animation-delay: 0s !important;
          transition: none !important;
        }
      }
      .hd {
        background: #b2198b;
        color: #fff;
        padding: 10px 12px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .ms {
        flex: 1;
        overflow: auto;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .bm {
        max-width: 85%;
        padding: 9px 12px;
        border-radius: 14px;
        font-size: 14px;
        line-height: 1.35;
      }
      .bm.a {
        background: #f9eef5;
        align-self: flex-start;
      }
      .bm.u {
        background: #b2198b;
        color: #fff;
        align-self: flex-end;
      }
      .ch {
        display: flex;
        gap: 6px;
        padding: 0 12px 8px;
        flex-wrap: wrap;
      }
      .ch button {
        border: 0;
        background: #e6b9d5;
        color: #3a1030;
        border-radius: 18px;
        padding: 0 12px;
        min-height: 36px;
        font-size: 12px;
        font-weight: 600;
      }
      .in {
        display: flex;
        gap: 8px;
        padding: 10px;
        border-top: 1px solid #e6b9d5;
      }
      .in .fi {
        flex: 1;
        min-width: 0;
        height: 44px;
        border-radius: 22px;
        font-size: 14px;
      }
      .sk {
        position: absolute;
        bottom: 96px;
        width: 112px;
        height: 112px;
        border-radius: 50%;
        background: #ffffffb8;
        border: 2px solid #fff;
        box-shadow: 0 4px 14px #3a103040;
        touch-action: none;
        user-select: none;
        display: grid;
        place-items: center;
      }
      .sk div {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: #b2198b;
        border: 3px solid #fff;
        pointer-events: none;
      }
      .lb {
        position: absolute;
        bottom: 214px;
        width: 112px;
        text-align: center;
        font-size: 12px;
        font-weight: 600;
        color: #fff;
        background: #3a1030cc;
        border-radius: 10px;
        padding: 3px 0;
      }
    </style>
  </head>

          gs = [1, 0, 2, 3, 4, 5, 6, 7, 8, 9]
            .map((c) => [c, ls.filter((s) => s[0] == c)])

        return `<div style="flex:1;min-width:0;display:flex;flex-direction:column"><div class="rw" style="height:68px;padding:0 24px;background:#fff;border-bottom:1px solid #e6b9d5;flex:none;gap:14px">${logo(52)}<div style="flex:1;font-size:20px;font-weight:700">${t("stT")}</div><button class="g sb" data-a="so" style="display:flex;gap:6px;align-items:center">${SOUT}${t("so")}</button><button class="i" data-a="s" data-v="home" aria-label="Home">${HOME}</button></div>
<div class="rw" style="padding:12px 24px;flex:none"><label for="f1" style="position:absolute;left:-9999px">${t("stAllC")}</label><select id="f1" class="fi" style="flex:1">${op(CITY, S.fc, t("stAllC"))}</select><label for="f2" style="position:absolute;left:-9999px">${t("stAllT")}</label><select id="f2" class="fi" style="flex:1">${op(TYP, S.ft, t("stAllT"))}</select><button class="b" data-a="fs">${t("stSrch")}</button></div>
<div style="flex:1;min-height:0;overflow:auto;padding:0 24px 96px">${gs.length ? gs.map(([c, l]) => `<div style="font-size:16px;font-weight:700;margin:10px 0 8px">${h(CITY[c].split("|")[L])} <span class="sm">· ${t("stCt", l.length)}</span></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">${l.map((s) => `<div class="cd" style="padding:0;overflow:hidden"><div style="height:60px;background:linear-gradient(135deg,#e6b9d5,#f9eef5);display:grid;place-items:center">${STORE}</div><div style="padding:10px 12px;display:flex;flex-direction:column;gap:4px"><b style="font-size:14px">${h(s[2])}</b><span style="font-size:11px;font-weight:600;color:#8a1269">${h(TYP[s[1]].split("|")[L])}</span><span class="sm" style="font-size:12px">${h(s[3])}</span></div></div>`).join("")}</div>`).join("") : `<p>${t("stNo")}</p>`}</div></div>`;
      }
      function cart() {
        const x = tot(),
          k = Object.entries(S.cart);
        return `<div style="flex:1;min-width:0;padding:24px 28px;display:flex;flex-direction:column;gap:10px"><div style="display:flex;justify-content:space-between;align-items:center;height:48px;flex:none"><div style="font-size:22px;font-weight:700">${t("cart")} <span class="sm">· ${t("items", n())}</span></div><button class="i" data-a="s" data-v="home" aria-label="Home">${HOME}</button></div><div style="flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px">${
          k.length
            ? k
                .map(([id, q]) => {
                  const p = byId(id);
                  return `<div class="cd rw" style="height:68px;flex:none"><span class="o" style="background:${BG[p.d]}">${ic(p.d)}</span><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:16px">${h(pn(p))}</div><div class="sm">${t("aisle", p.d + 1)}</div></div><button class="g" style="width:44px;padding:0" data-a="q" data-id="${id}" data-d="-1" aria-label="-">&minus;</button><span style="width:20px;text-align:center;font-weight:700">${q}</span><button class="g" style="width:44px;padding:0" data-a="q" data-id="${id}" data-d="1" aria-label="+">+</button><span style="width:84px;text-align:right;font-weight:700">${fmt(p.price * q)}</span></div>`;
                })
                .join("")
            : `<p>${t("empty")}</p>`
        }</div></div>
<div style="width:300px;background:#B2198B;color:#fff;padding:28px 28px 100px;display:flex;flex-direction:column;gap:14px"><div style="font-size:20px;font-weight:700">${t("cart")}</div><div style="display:flex;justify-content:space-between"><span>${t("sub")}</span><span>${fmt(x.subtotal)}</span></div><div style="display:flex;justify-content:space-between"><span>${t("save")}</span><span>&minus;${fmt(x.savings)}</span></div><div style="border-top:1px solid #e6b9d5;padding-top:14px"><div style="font-size:14px;color:#f9eef5">${t("total")}</div><div style="font-size:32px;font-weight:700">${fmt(x.total)}</div></div><div style="flex:1"></div><button class="g" style="min-height:56px;font-size:17px" data-a="pay">${t("checkout")}</button><button data-a="s" data-v="home" style="min-height:48px;border-radius:14px;border:2px solid #e6b9d5;background:transparent;color:#fff;font-weight:600;font-size:15px">${t("keep")}</button></div>`;
      }
      const modal = () =>
        `<div style="position:absolute;inset:0;background:#3a1030aa;display:grid;place-items:center;z-index:4;animation:fade .2s ease-out"><div role="dialog" aria-modal="true" style="animation:pop .26s cubic-bezier(.2,.8,.2,1);background:#fff;border-radius:22px;padding:28px;width:380px;display:flex;flex-direction:column;gap:14px;text-align:center;align-items:center">${S.modal == "choose" ? `<div style="font-size:20px;font-weight:700">${t("payQ")}</div><div style="font-size:26px;font-weight:700;color:#B2198B">${fmt(tot().total)}</div><button class="t" data-a="pm" data-v="cart" style="width:100%;height:auto;flex-direction:row;align-items:center"><span class="o">${I24('<path d="M3 4h3l2 11h10l2-8H7"/><circle cx="10" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/>')}</span><span>${t("payCart")}<br><span class="sm">${t("payCartS")}</span></span></button><button class="t" data-a="pm" data-v="counter" style="width:100%;height:auto;flex-direction:row;align-items:center"><span class="o">${I24('<rect x="3" y="9" width="18" height="10" rx="2"/><path d="M7 9V5h10v4M8 14h8"/>')}</span><span>${t("payCnt")}<br><span class="sm">${t("payCntS")}</span></span></button><button class="g" style="width:100%" data-a="back">${t("back")}</button>` : S.modal == "counter" ? `<div style="font-size:20px;font-weight:700">${t("cntT")}</div><div style="font-size:40px;font-weight:700;color:#B2198B;letter-spacing:2px">${S.code}</div><div class="sm">${t("cntS")}</div><div style="font-size:22px;font-weight:700">${fmt(tot().total)}</div><button class="b" style="width:100%" data-a="done">${t("done")}</button>` : S.modal == "cart" ? `<div style="font-size:20px;font-weight:700">${t("payT")}</div><div style="font-size:34px;font-weight:700;color:#B2198B">${fmt(tot().total)}</div><button class="b" style="width:100%;min-height:56px" data-a="done">${t("payNow")}</button><button class="g" style="width:100%" data-a="back">${t("back")}</button>` : `${chick(72)}<div style="font-size:22px;font-weight:700">${t("thanks")}</div><div class="sm">${t("rcpt")}</div><button class="b" style="width:100%" data-a="end">${t("newT")}</button>`}</div></div>`;
      const ORD = { login: 0, home: 1, stores: 2, cart: 2, map: 2, aisle: 3 },
        RM = matchMedia("(prefers-reduced-motion:reduce)").matches;
      let PS = null,
        PV = null;
      function render() {
        R = route();
        const sc = $("#sc");
        sc.innerHTML =
          { login, home, map, aisle, cart, stores }[S.screen]() +
          (S.modal ? modal() : "");
        if (S.screen == "home") rs();
        if (S.screen == "aisle") fpStart();
        if (!RM) {
          if (PS && PS != S.screen) {
            const d = ORD[S.screen] >= ORD[PS] ? 1 : -1;
            sc.animate(
              [
                {
                  opacity: 0,
                  transform: `translateX(${30 * d}px) scale(.985)`,
                },
                { opacity: 1, transform: "none" },
              ],
              { duration: 360, easing: "cubic-bezier(.2,.7,.2,1)" },
            );
          } else if (S.screen == "map" && PV && PV != S.view) {
            const f = (v) => (v == "3d" ? TILT : "none");
            $("#mp").animate([{ transform: f(PV) }, { transform: f(S.view) }], {
              duration: 600,
              easing: "ease-in-out",
            });
          }
        }
        PS = S.screen;
        PV = S.view;
      }
      /* ---- Pip: the assistant / brain ---- */
      const mk = (name, description, props, req, fn) => ({
        name,
        description,
        inputSchema: { type: "object", properties: props, required: req },
        execute: fn,
      });
      const pid = {
        product_id: { type: "string", description: "id from the catalog" },
      };
      const tools = [
        mk(
          "find_products",
          "Search products by name or department (any language)",
          { query: { type: "string" } },
          ["query"],
          (i) => A.find(i.query),
        ),
        mk(
          "navigate_to",
          "Guide the shopper to a product: opens the map with the route",
          pid,
          ["product_id"],
          (i) => A.go(i.product_id),
        ),
        mk(
          "add_to_cart",
          "Add a product to the cart",
          { ...pid, qty: { type: "number" } },
          ["product_id"],
          (i) => A.add(i.product_id, i.qty || 1),
        ),
        mk(
          "remove_from_cart",
          "Remove a product from the cart completely",
          pid,
          ["product_id"],
          (i) => A.add(i.product_id, -99),
        ),
        mk(
          "show_screen",
          "Open a screen",
          {
            screen: {
              type: "string",
              enum: ["home", "map", "aisle", "cart", "stores"],
            },
          },
          ["screen"],
          (i) => A.screen(i.screen),
        ),
        mk(
          "set_map_view",
          "Change the guidance view (first_person is the automatic guided walk-through)",
          { view: { type: "string", enum: ["top", "3d", "first_person"] } },
          ["view"],
          (i) => A.view(i.view),
        ),
        mk(
          "get_cart",
          "Read the cart, subtotal, savings and total",
          {},
          [],
          () => A.cart(),
        ),
        mk(
          "checkout",
          "Open checkout; the shopper chooses to pay at the cart or at a checkout counter (optionally preselect with method)",
          { method: { type: "string", enum: ["cart", "counter"] } },
          [],
          (i) => A.pay(i.method),
        ),
      ];
      const ctx = () =>
        "You are Pip, the friendly chick assistant and the brain of AIEON, a supermarket smart cart app. You control the app only through your tools (find_products, navigate_to, add_to_cart, remove_from_cart, show_screen, set_map_view, get_cart, checkout) and must never claim an action you did not perform. Prices are in Vietnamese dong. Always reply in " +
        LE[L] +
        ", in at most two short plain-text sentences.\nCatalog: " +
        P.map(
          (p) =>
            `${p.id}=${p.n[1]} (${D[p.d].n[1]}, aisle ${p.d + 1}, ${p.price})`,
        ).join("; ") +
        "\nState: " +
        JSON.stringify({
          screen: S.screen,
          destination: S.dest.n[1],
          route_m: R.m,
          member: !!(S.user && S.user.member),
          cart: A.cart(),
        }) +
        "\nShopper: ";
      function local(q) {
        const s = nz(q),
          m = find(q)[0],
          x = (r) => r.test(s);
        if (S.screen == "login") return t("hiS");
        if (x(/check ?out|\bpay\b|thanh toan|お会計|支払|결제|结账|支付/)) {
          A.pay();
          return t("lPay", fmt(tot().total));
        }
        if (x(/remove|delete|xoa|bo ra|削除|取り消|빼|삭제|移除|删除/) && m) {
          A.add(m.id, -99);
          return t("lRem", pn(m));
        }
        if (
          x(/\badd\b|\bbuy\b|put|\bthem\b|追加|入れ|담|넣|加入|添加|买/) &&
          m
        ) {
          A.add(m.id, 1);
          return t("lAdd", pn(m));
        }
        if (x(/cart|basket|total|gio hang|カート|장바구니|购物车|购物篮/)) {
          A.screen("cart");
          return t("lCart", n(), fmt(tot().total));
        }
        if (
          x(
            /first.?person|aisle view|goc nhin thu nhat|一人称|1인칭|第一人称|joystick/,
          )
        ) {
          A.view("first_person");
          return t("lFp");
        }
        if (x(/3d/)) {
          A.view("3d");
          return t("l3d");
        }
        if (
          x(
            /top view|top-down|\bmap\b|ban do|tu tren|真上|マップ|지도|위에서|俯视|地图/,
          )
        ) {
          A.view("top");
          return t("lTop");
        }
        if (x(/\bstores?\b|cua hang|店舗|매장|门店/)) {
          A.screen("stores");
          return t("stFind");
        }
        if (x(/\bhome\b|menu|\bback\b|trang chu|ホーム|홈|主页/)) {
          A.screen("home");
          return t("lHome");
        }
        if (m) {
          const r = A.go(m.id);
          return t("lGo", pn(m), r.aisle, r.distance_m, r.minutes);
        }
        return t("lNo");
      }
      const Hh = [];
      let g0;
      function say(c, x) {
        const e = document.createElement("div");
        e.className = "bm " + c;
        e.textContent = x;
        const m = $("#ms");
        m.appendChild(e);
        m.scrollTop = m.scrollHeight;
        return e;
      }
      async function ask(q) {
        $("#pn").hidden = false;
        say("u", q);
        const b = say("a", "…");
        Hh.push({ role: "user", content: q });
        let r;
        try {
          if (!AI) throw 0;
          const msgs = Hh.slice(-7).map((x) => ({ ...x }));
          msgs[msgs.length - 1].content = ctx() + q;
          const o = await AI(msgs, {
            tools,
            cache: false,
            modelTier: "quick",
            onText: ({ text }) => {
              if (text) b.textContent = text;
            },
          });
          r = (o.text || "").trim() || "Done!";
        } catch (e) {
          if (e && e.code == "not_granted") AI = null;
          r = local(q);
        }
        b.textContent = r;
        Hh.push({ role: "assistant", content: r });
        $("#ms").scrollTop = 1e5;
      }
      function send() {
        const i = $("#ci"),
          x = i.value.trim();
        if (x) {
          i.value = "";
          ask(x);
        }
      }
      function uai() {
        $("#ps").textContent = t("pipSub");
        $("#ci").placeholder = t("pipPh");
        $("#sd").textContent = t("send");
        $("#xc").setAttribute("aria-label", t("cls"));
        $("#fb").setAttribute("aria-label", t("opn"));
        $("#cp").innerHTML = [1, 2, 3, 4]
          .map(
            (i) => `<button data-a="chip" data-i="${i}">${t("c" + i)}</button>`,
          )
          .join("");
        if (!Hh.length && g0) g0.textContent = t("pipHi");
      }
      /* ---- wiring ---- */
      function signin() {
        const id = $("#lid").value.trim(),
          pin = $("#lpin").value.trim();
        if (!/^\d{9,11}$/.test(id) || pin.length < 4) {
          $("#er").textContent = t("bad");
          return;
        }
        S.user = { id, member: 1 };
        S.screen = "home";
        render();
      }
      document.addEventListener("click", (e) => {
        const el = e.target.closest("[data-a]");
        if (!el) return;
        const a = el.dataset.a,
          id = el.dataset.id,
          v = el.dataset.v;
        if (a == "s") A.screen(v);
        else if (a == "v") A.view(v);
        else if (a == "go") A.go(id);
        else if (a == "add") A.add(id, 1);
        else if (a == "q") A.add(id, +el.dataset.d);
        else if (a == "in") signin();
        else if (a == "gst") {
          S.user = { guest: 1 };
          S.screen = "home";
          render();
        } else if (a == "so") signout();
        else if (a == "pp") fpPP();
        else if (a == "rp") fpReset();
        else if (a == "spd") {
          FP.sp = FP.sp == 1 ? 2 : 1;
          setPP();
        } else if (a == "fpw") toast(t("fpwM"));
        else if (a == "fs") {
          S.fc = +$("#f1").value;
          S.ft = +$("#f2").value;
          render();
        } else if (a == "pm") A.pay(v);
        else if (a == "dept") {
          S.q = v;
          $("#q").value = v;
          rs();
        } else if (a == "clr") {
          S.q = "";
          $("#q").value = "";
          rs();
        } else if (a == "pay") A.pay();
        else if (a == "done") {
          S.modal = "done";
          render();
        } else if (a == "end") {
          S.modal = null;
          S.cart = {};
          S.pos = [180, 495];
          S.screen = "home";
          render();
        } else if (a == "back") {
          S.modal = null;
          render();
        } else if (a == "arr") A.arrive();
        else if (a == "ai") $("#pn").hidden = !$("#pn").hidden;
        else if (a == "chip") ask(t("c" + el.dataset.i));
        else if (a == "send") send();
      });
      document.addEventListener("input", (e) => {
        if (e.target.id == "q") {
          S.q = e.target.value;
          rs();
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key == "Enter" && (e.target.id == "lid" || e.target.id == "lpin"))
          signin();
      });
      $("#lg").innerHTML = LN.map(
        (x, i) => `<option value="${i}">${x}</option>`,
      ).join("");
      $("#lg").value = L;
      $("#lg").onchange = (e) => {
        L = +e.target.value;
        document.documentElement.lang = LG[L];
        render();
        uai();
      };
      $("#ai").innerHTML =
        `<div class="pn" id="pn" hidden><div class="hd">${chick(36)}<div style="flex:1"><div style="font-weight:700">Pip</div><div id="ps" style="font-size:12px"></div></div><button id="xc" class="i" style="width:44px;height:44px" data-a="ai">&times;</button></div><div class="ms" id="ms" aria-live="polite"></div><div class="ch" id="cp"></div><div class="in"><label for="ci" style="position:absolute;left:-9999px">Pip</label><input id="ci" class="fi" autocomplete="off"><button id="sd" class="b" style="min-height:44px;padding:0 16px" data-a="send"></button></div></div><button id="fb" class="fab" data-a="ai">${chick(44)}</button>`;
      $("#ci").addEventListener("keydown", (e) => {
        if (e.key == "Enter") send();
      });
      g0 = say("a", "");
      uai();
      /* idle session: warning after 3:00, automatic sign-out after 3:30 without any interaction */
      const IDLE_WARN = 180e3,
        IDLE_OUT = 210e3;
      let act = Date.now();
      function wn(on, sec) {
        const e = $("#wn");
        if (!on) {
          e.style.display = "none";
          return;
        }
        e.style.display = "flex";
        e.innerHTML = `<div><b>${t("idleW")}</b><div class="sm">${t("idleN", sec)}</div></div><button class="b" data-a="stay">${t("idleS")}</button>`;
      }
      function signout(auto) {
        S.user = null;
        S.screen = "login";
        S.modal = null;
        S.q = "";
        render();
        wn(0);
        if (auto) toast(t("idleOut"));
      }
      ["pointerdown", "pointermove", "keydown", "touchstart", "wheel"].forEach(
        (ev) =>
          addEventListener(
            ev,
            () => {
              act = Date.now();
              wn(0);
            },
            { passive: true },
          ),
      );
      setInterval(() => {
        if (S.screen == "login") {
          wn(0);
          return;
        }
        const i = Date.now() - act;
        if (i >= IDLE_OUT) signout(1);
        else if (i >= IDLE_WARN) wn(1, Math.ceil((IDLE_OUT - i) / 1000));
      }, 1000);
      const fit = () => {
        $("#st").style.transform =
          `scale(${Math.min(innerWidth / 960, innerHeight / 540)})`;
      };
      addEventListener("resize", fit);
      fit();
      try {
        window.claude &&
          claude
            .use("sample")
            .then((s) => {
              AI = s;
            })
            .catch(() => {});
      } catch (e) {}
      render();
    </script>
